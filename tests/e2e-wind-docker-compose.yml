services:
 
  kos:
    image: simulator
    build:
      context: ..
      dockerfile: ./Dockerfile
    container_name: kos
    command: /home/user/kos/cross-build.sh --target sim --mode offline --simulator-ip 172.28.0.2
    working_dir: /home/user/kos
    user: user
    depends_on:
      - arducopter
    networks:
      cyberimmune:
        ipv4_address: 172.28.0.1
 
  arducopter:
    image: simulator
    container_name: arducopter
    # Added parameter --wind=10,0,0.2
    # 10 m/s, direction north (0°), turbulence 0.2
    command: >
      /home/user/ardupilot/sitl/arducopter
      -S --model + --speedup 1 --slave 0
      --defaults copter.parm
      --home=60.0144850,27.8200870,20.00,200
      --wind=10,0,0.2
      -I0
    working_dir: /home/user/ardupilot
    user: user
    restart: always
    ports:
      - "5760:5760"
    networks:
      cyberimmune:
        ipv4_address: 172.28.0.2
 
  mavproxy:
    image: simulator
    container_name: mavproxy
    command: python3 /home/user/tests/e2e-wind/test.py
    working_dir: /home/user
    user: user
    depends_on:
      - arducopter
      - kos
    networks:
      cyberimmune:
        ipv4_address: 172.28.0.3
 
networks:
  cyberimmune:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24
          gateway: 172.28.5.254
